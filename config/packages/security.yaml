security:
  password_hashers:
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      provider: app_user_provider
      custom_authenticator:
        - App\Security\AppAuthenticator
      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800
        path: /
      logout:
        path: app_logout
        target: app_login
        invalidate_session: true
        csrf_parameter: _csrf_token
        csrf_token_id: logout

  access_control:
    # --- PUBLIC API (autocomplete) — must come first ---
    - { path: ^/etudiant/api/etudiants/suggest,  roles: PUBLIC_ACCESS }
    - { path: ^/etudiant/api/etudiants/by-classe, roles: PUBLIC_ACCESS }

    # --- Auth pages & registration flow ---
    - { path: ^/login$,    roles: PUBLIC_ACCESS }
    - { path: ^/register$, roles: PUBLIC_ACCESS }
    # verification link can be public; the controller itself checks IS_AUTHENTICATED_FULLY
    - { path: ^/verify/email$, roles: PUBLIC_ACCESS }

    # --- Public home page ---
    - { path: ^/$, roles: PUBLIC_ACCESS }

    # --- Protected areas ---
    - { path: ^/parent,                             roles: ROLE_PARENT }
    - { path: ^/admin,                              roles: ROLE_ADMIN }
    - { path: ^/(etudiant|paiement|personnel|salaire), roles: ROLE_ADMIN }

    # --- Catch‑all: anything else requires login ---
    - { path: ^/, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/admin/emplois, roles: ROLE_ADMIN }
  # Keep your public API open if you like (or protect it)
    - { path: ^/admin/emplois/api, roles: PUBLIC_ACCESS }