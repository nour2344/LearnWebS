security:
  password_hashers:
    App\Entity\User: 'auto'   # better than the interface key

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        csrf_parameter: _csrf_token
        csrf_token_id: authenticate
        username_parameter: email
        password_parameter: password

      logout:
        path: app_logout
        target: app_login            # <— redirect after logout
        invalidate_session: true
        csrf_parameter: _csrf_token   # <— matches Twig form below
        csrf_token_id: logout

      remember_me:
        secret: '%kernel.secret%'     # <— prefer kernel.secret
        lifetime: 604800              # 7 days
        path: /

  # first match wins — put public routes first
  access_control:
    - { path: ^/logout$, roles: PUBLIC_ACCESS }
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/register$, roles: PUBLIC_ACCESS }
    - { path: ^/verify/email$, roles: IS_AUTHENTICATED_FULLY }

    # protect your dashboard/root + feature areas (adjust paths as needed)
    - { path: ^/$, roles: ROLE_USER }
    - { path: ^/(admin|etudiant|paiement|personnel|salaire), roles: ROLE_USER }
