security:
  password_hashers:
    # Using the concrete class is a bit cleaner than the interface here
    App\Entity\User: 'auto'

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider

      # Built-in form_login (works with your SecurityController::login)
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        csrf_parameter: _csrf_token
        csrf_token_id: authenticate
        username_parameter: email
        password_parameter: password

      # Logout (intercepts your /logout route)
      logout:
        path: app_logout
        target: app_login
        invalidate_session: true
        # If you render logout as a POST form with a CSRF token:
        csrf_parameter: _csrf_token
        csrf_token_id: logout

      remember_me:
        secret: '%kernel.secret%'   # <- prefer parameter over env() here
        lifetime: 604800            # 7 days
        path: /

      # Optional but recommended:
      #login_throttling:
       # max_attempts: 5
        #interval: '15 minutes'

      # If you add the UserChecker to block non-verified users, uncomment:
      # user_checker: App\Security\UserChecker

  access_control:
    # Public pages
    - { path: ^/login$, roles: PUBLIC_ACCESS }
    - { path: ^/register$, roles: PUBLIC_ACCESS }

    # Email verification route (your controller requires full auth)
    - { path: ^/verify/email$, roles: IS_AUTHENTICATED_FULLY }

    # Protect your admin area (adjust the path to your real admin prefix)
    - { path: ^/admin, roles: ROLE_USER }

    # (Optional) allow the logout path without auth
    - { path: ^/logout$, roles: PUBLIC_ACCESS }
